# Save in your repo as: .github/workflows/sharpping.yml
# Runs every 15 min, but the script exits instantly (no credits spent) unless
# a game is close and the poll interval / daily cap allow a real poll.
name: sharpping

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharpping
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run SharpPing
        run: python sharpping.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORT: ${{ vars.SPORT }}
          BANKROLL: ${{ vars.BANKROLL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
      - name: Save state and log
        run: |
          mkdir -p data
          git config user.name "sharpping-bot"
          git config user.email "sharpping-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "sharpping data" && git push)
